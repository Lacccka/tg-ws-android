android.useAndroidX=true

# privateSideload carries large native/network dependencies (Cronet + Tor +
# IPtProxy). Keep Gradle and the Kotlin compiler inside bounded but realistic
# heaps so CI and local Windows builds do not fail with backend OOM while
# compiling the existing telemetry/proxy code against that classpath.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m
