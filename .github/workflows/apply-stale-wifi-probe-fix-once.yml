name: Apply stale Wi-Fi probe race fix once

on:
  pull_request:
    branches:
      - snowflake-tor-proxy-test
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Apply stale Wi-Fi probe race fix
        run: python3 .github/scripts/apply_stale_wifi_probe_fix.py

      - name: Verify race regression repeatedly
        run: |
          for i in 1 2 3 4 5; do
            echo "===== focused race run $i ====="
            ./gradlew testDebugUnitTest \
              --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.staleWifiHealthPromotionCallbackCannotRepromoteAfterMobileTransition" \
              --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.networkChangeWifiToMobileUpdatesEffectiveRouteToCfFirst" \
              --rerun-tasks --stacktrace
          done

      - name: Verify Tor production fallback regression
        run: >-
          ./gradlew testPrivateSideloadUnitTest
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.autoMobileForcedOrdinaryConnectorFailuresReachTorThroughProductionRouting"
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.staleWifiHealthPromotionCallbackCannotRepromoteAfterMobileTransition"
          --stacktrace

      - name: Compile private sideload
        run: ./gradlew compilePrivateSideloadKotlin --stacktrace

      - name: Commit fix and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_stale_wifi_probe_fix.py .github/workflows/apply-stale-wifi-probe-fix-once.yml
          git add app/src/main/java/com/flowseal/tgwsandroid/proxy/ProxyServer.kt \
                  app/src/test/java/com/flowseal/tgwsandroid/proxy/ProxyServerTest.kt
          git commit -m "Reject stale Wi-Fi direct promotions"
          git push origin HEAD:snowflake-tor-auto-fallback
