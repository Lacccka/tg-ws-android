name: Upstream parity check

on:
  push:
    branches:
      - upstream-v1.10-core-parity

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run debug unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest
