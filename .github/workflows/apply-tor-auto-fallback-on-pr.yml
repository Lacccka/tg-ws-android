name: Apply Tor auto fallback on PR

on:
  pull_request:
    branches:
      - snowflake-tor-proxy-test

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply deterministic integration patch
        run: python3 tools/apply_tor_auto_fallback_patch.py
      - name: Preserve legacy test helper call order
        run: python3 tools/fix_tor_patch_test_helper.py
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Run debug unit suite
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Compile private Tor fallback
        if: always()
        run: ./gradlew compilePrivateSideloadKotlin --stacktrace
      - name: Run private unit suite with one clean retry for known race
        shell: bash
        run: |
          set +e
          ./gradlew testPrivateSideloadUnitTest --stacktrace
          first=$?
          set -e
          if [ "$first" -ne 0 ]; then
            echo "Private suite failed once; rerunning clean to distinguish the known ProxyServer route-health race."
            ./gradlew cleanTestPrivateSideloadUnitTest testPrivateSideloadUnitTest --stacktrace
          fi
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/flowseal/tgwsandroid/proxy/ProxyServer.kt \
                  app/src/main/java/com/flowseal/tgwsandroid/service/ProxyForegroundService.kt \
                  app/src/test/java/com/flowseal/tgwsandroid/proxy/ProxyServerTest.kt
          git commit -m "Integrate Snowflake Tor as mobile fallback route"
          git push origin HEAD:snowflake-tor-auto-fallback
