name: Upstream v1.10 full validation

on:
  push:
    branches:
      - upstream-v1.10-validation
  pull_request:
    branches:
      - upstream-v1.10-fronting-pool-diagnostics

jobs:
  full-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run full unit suite and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-android-v1.10-validation-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
