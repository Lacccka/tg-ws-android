name: Upstream v1.10 full validation

on:
  push:
    branches:
      - upstream-v1.10-validation
      - fix-private-sideload-special-use
      - worker-diagnostics-probe
  pull_request:
    branches:
      - upstream-v1.10-fronting-pool-diagnostics
      - upstream-v1.10-validation
      - fix-private-sideload-special-use

jobs:
  full-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check tools/cloudflare-worker/worker.js
      - name: Run full unit suite and build private sideload APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assemblePrivateSideload
      - name: Verify private sideload special-use manifest
        run: |
          merged_manifest="$(find app/build/intermediates/merged_manifest/privateSideload -name AndroidManifest.xml -print -quit)"
          test -n "$merged_manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$merged_manifest"
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$merged_manifest"
          grep -q 'android:foregroundServiceType="specialUse"' "$merged_manifest"
          grep -q 'com.flowseal.tgwsandroid.WorkerDiagnosticsActivity' "$merged_manifest"
          grep -q 'SE Worker Test' "$merged_manifest"
          grep -q 'com.flowseal.tgwsandroid.WorkerPreferredEdgeActivity' "$merged_manifest"
          grep -q 'SE Edge Test' "$merged_manifest"
          grep -q 'com.flowseal.tgwsandroid.WorkerTlsFragmentActivity' "$merged_manifest"
          grep -q 'SE TLS Frag Test' "$merged_manifest"
          grep -q 'com.flowseal.tgwsandroid.WorkerFragmentedE2eActivity' "$merged_manifest"
          grep -q 'SE Worker Frag E2E' "$merged_manifest"
          grep -q 'com.flowseal.tgwsandroid.WorkerNoSniE2eActivity' "$merged_manifest"
          grep -q 'SE Worker No-SNI E2E' "$merged_manifest"
      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-android-v1.10-private-sideload-apk
          path: app/build/outputs/apk/privateSideload/*.apk
          if-no-files-found: error
          retention-days: 7
