name: Apply Tor service cleanup on PR

on:
  pull_request:
    branches:
      - snowflake-tor-proxy-test

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply service cleanup patch
        run: python3 tools/fix_tor_service_cleanup.py
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Compile debug and private variants
        run: ./gradlew compileDebugKotlin compilePrivateSideloadKotlin --stacktrace
      - name: Run focused proxy unit suite
        run: ./gradlew testDebugUnitTest --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest' --stacktrace
      - name: Commit cleanup and remove one-shot scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/flowseal/tgwsandroid/service/ProxyForegroundService.kt
          git rm tools/fix_tor_service_cleanup.py .github/workflows/apply-tor-service-cleanup-on-pr.yml
          git commit -m "Harden Tor fallback service lifecycle"
          git push origin HEAD:snowflake-tor-auto-fallback
