name: Apply lazy Tor warmup once

on:
  pull_request:
    branches:
      - snowflake-tor-proxy-test
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'snowflake-tor-auto-fallback'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Apply lazy Tor warmup migration
        run: python3 .github/scripts/apply_tor_lazy_warmup.py

      - name: Focused warmup policy tests
        run: ./gradlew testDebugUnitTest --tests 'com.flowseal.tgwsandroid.service.TorFallbackWarmupPolicyTest' --stacktrace

      - name: Focused ProxyServer Tor tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.autoMobileForcedOrdinaryConnectorFailuresReachTorThroughProductionRouting' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.autoMobileUsesTorSnowflakeAfterOrdinaryRoutesAreUnavailable' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.unknownDirectDcFallsBackToTorUsingTunnelDnsAfterCfFailure' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.warmingTorFallbackDoesNotCountAsTorNetworkFailure' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.serviceReadinessGateSkipsColdTorConnectorButSignalsOrdinaryExhaustion' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.serviceReadinessGateCanWaitForWarmTorWithoutTelegramReconnect' \
            --stacktrace

      - name: Compile private sideload
        run: ./gradlew compilePrivateSideloadKotlin --stacktrace

      - name: Focused private tests
        run: |
          ./gradlew testPrivateSideloadUnitTest \
            --tests 'com.flowseal.tgwsandroid.service.TorFallbackWarmupPolicyTest' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.serviceReadinessGateSkipsColdTorConnectorButSignalsOrdinaryExhaustion' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.serviceReadinessGateCanWaitForWarmTorWithoutTelegramReconnect' \
            --stacktrace

      - name: Commit migration and remove one-shot scaffolding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/scripts/apply_tor_lazy_warmup.py
          rm .github/workflows/apply-tor-lazy-warmup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Warm Tor only after mobile route degradation'
          git push origin HEAD:snowflake-tor-auto-fallback
