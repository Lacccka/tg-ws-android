name: Apply Tor production fallback test once

on:
  pull_request:
    branches:
      - snowflake-tor-proxy-test
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Apply production fallback test patch
        run: python3 .github/scripts/apply_tor_production_fallback_test.py

      - name: Verify focused debug routing tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.autoMobileForcedOrdinaryConnectorFailuresReachTorThroughProductionRouting"
          --tests "com.flowseal.tgwsandroid.service.TorFallbackDiagnosticReportTest"
          --stacktrace

      - name: Verify focused private routing tests
        run: >-
          ./gradlew testPrivateSideloadUnitTest
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.autoMobileForcedOrdinaryConnectorFailuresReachTorThroughProductionRouting"
          --tests "com.flowseal.tgwsandroid.service.TorFallbackDiagnosticReportTest"
          --stacktrace

      - name: Compile private test controller
        run: ./gradlew compilePrivateSideloadKotlin --stacktrace

      - name: Commit production test controller and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_tor_production_fallback_test.py .github/workflows/apply-tor-production-fallback-test-once.yml
          git add app/src/main/java/com/flowseal/tgwsandroid/service/ProxyForegroundService.kt \
                  app/src/main/java/com/flowseal/tgwsandroid/service/DiagnosticReport.kt \
                  app/src/privateSideload/java/com/flowseal/tgwsandroid/DiagnosticsHubActivity.kt \
                  app/src/privateSideload/java/com/flowseal/tgwsandroid/TorProductionFallbackTestActivity.kt \
                  app/src/privateSideload/AndroidManifest.xml \
                  app/src/test/java/com/flowseal/tgwsandroid/proxy/ProxyServerTest.kt \
                  app/src/test/java/com/flowseal/tgwsandroid/service/TorFallbackDiagnosticReportTest.kt
          git commit -m "Add production Tor fallback field test"
          git push origin HEAD:snowflake-tor-auto-fallback
