name: Harden lazy Tor warmup once

on:
  pull_request:
    branches:
      - snowflake-tor-proxy-test
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'snowflake-tor-auto-fallback'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Apply hardening
        run: python3 .github/scripts/harden_tor_lazy_warmup.py
      - name: Focused debug tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'com.flowseal.tgwsandroid.service.TorFallbackWarmupPolicyTest' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.serviceReadinessGateSkipsColdTorConnectorButSignalsOrdinaryExhaustion' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.serviceReadinessGateCanWaitForWarmTorWithoutTelegramReconnect' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.warmupWaitersAreBoundedDuringReconnectStorm' \
            --stacktrace
      - name: Compile private sideload
        run: ./gradlew compilePrivateSideloadKotlin --stacktrace
      - name: Focused private tests
        run: |
          ./gradlew testPrivateSideloadUnitTest \
            --tests 'com.flowseal.tgwsandroid.service.TorFallbackWarmupPolicyTest' \
            --tests 'com.flowseal.tgwsandroid.proxy.ProxyServerTest.warmupWaitersAreBoundedDuringReconnectStorm' \
            --stacktrace
      - name: Commit and remove one-shot scaffolding
        run: |
          rm .github/scripts/harden_tor_lazy_warmup.py
          rm .github/workflows/harden-tor-lazy-warmup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Bound Tor warmup waits during reconnect storms'
          git push origin HEAD:snowflake-tor-auto-fallback
