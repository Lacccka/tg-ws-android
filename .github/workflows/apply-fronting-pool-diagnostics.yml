name: Apply fronting pool diagnostics edits

on:
  push:
    branches:
      - upstream-v1.10-fronting-pool-diagnostics
  pull_request:
    branches:
      - upstream-v1.10-fronting-runtime

permissions:
  contents: write

concurrency:
  group: apply-fronting-pool-diagnostics
  cancel-in-progress: true

jobs:
  apply-edits:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'upstream-v1.10-fronting-pool-diagnostics')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream-v1.10-fronting-pool-diagnostics
          fetch-depth: 1
      - name: Apply exact source edits
        run: |
          python3 .github/scripts/apply_fronting_pool_diagnostics.py
          rm .github/scripts/apply_fronting_pool_diagnostics.py
          rm .github/workflows/apply-fronting-pool-diagnostics.yml
          git diff --check
      - name: Commit source edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire fronting into direct pool and diagnostics'
          git pull --rebase origin upstream-v1.10-fronting-pool-diagnostics
          git push origin HEAD:upstream-v1.10-fronting-pool-diagnostics
