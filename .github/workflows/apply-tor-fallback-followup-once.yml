name: Apply Tor fallback follow-up once

on:
  push:
    branches:
      - snowflake-tor-auto-fallback
    paths:
      - .github/workflows/apply-tor-fallback-followup-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: snowflake-tor-auto-fallback
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply follow-up patch
        run: python3 .github/scripts/apply_tor_fallback_followup.py

      - name: Verify focused debug tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.unknownDirectDcFallsBackToTorUsingTunnelDnsAfterCfFailure"
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.cfOnlyUnknownDirectDcDoesNotUseTorFallback"
          --tests "com.flowseal.tgwsandroid.service.TorFallbackDiagnosticReportTest"
          --stacktrace

      - name: Verify focused private tests
        run: >-
          ./gradlew testPrivateSideloadUnitTest
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.unknownDirectDcFallsBackToTorUsingTunnelDnsAfterCfFailure"
          --tests "com.flowseal.tgwsandroid.proxy.ProxyServerTest.cfOnlyUnknownDirectDcDoesNotUseTorFallback"
          --tests "com.flowseal.tgwsandroid.service.TorFallbackDiagnosticReportTest"
          --stacktrace

      - name: Compile private runtime
        run: ./gradlew compilePrivateSideloadKotlin --stacktrace

      - name: Commit production changes and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_tor_fallback_followup.py .github/workflows/apply-tor-fallback-followup-once.yml
          git add app/src/main/java/com/flowseal/tgwsandroid/proxy/ProxyServer.kt \
                  app/src/main/java/com/flowseal/tgwsandroid/service/ProxyForegroundService.kt \
                  app/src/main/java/com/flowseal/tgwsandroid/service/DiagnosticReport.kt \
                  app/src/privateSideload/java/com/flowseal/tgwsandroid/SnowflakeTorFallbackRuntime.kt \
                  app/src/test/java/com/flowseal/tgwsandroid/proxy/ProxyServerTest.kt \
                  app/src/test/java/com/flowseal/tgwsandroid/service/TorFallbackDiagnosticReportTest.kt
          git commit -m "Cover unknown DCs with Tor fallback diagnostics"
          git push origin HEAD:snowflake-tor-auto-fallback
