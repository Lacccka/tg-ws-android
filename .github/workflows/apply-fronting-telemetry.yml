name: Apply fronting telemetry edits

on:
  push:
    branches:
      - upstream-v1.10-fronting-pool-diagnostics
  pull_request:
    branches:
      - upstream-v1.10-fronting-runtime

permissions:
  contents: write

concurrency:
  group: apply-fronting-telemetry
  cancel-in-progress: true

jobs:
  apply-edits:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'upstream-v1.10-fronting-pool-diagnostics')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream-v1.10-fronting-pool-diagnostics
          fetch-depth: 1
      - name: Apply exact telemetry edits
        run: |
          python3 .github/scripts/apply_fronting_telemetry.py
          rm .github/scripts/apply_fronting_telemetry.py
          git diff --check
      - name: Commit telemetry edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose fronting and pool backoff in telemetry'
          git pull --rebase origin upstream-v1.10-fronting-pool-diagnostics
          git push origin HEAD:upstream-v1.10-fronting-pool-diagnostics
