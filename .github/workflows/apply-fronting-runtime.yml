name: Apply fronting runtime edits

on:
  push:
    branches:
      - upstream-v1.10-fronting-runtime
  pull_request:
    branches:
      - upstream-v1.10-fronting

permissions:
  contents: write

jobs:
  apply-edits:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'upstream-v1.10-fronting-runtime')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream-v1.10-fronting-runtime
          fetch-depth: 1
      - name: Apply exact runtime edits
        run: |
          python3 .github/scripts/apply_fronting_runtime.py
          rm .github/scripts/apply_fronting_runtime.py
          rm -f .github/patches/fronting-runtime.patch
          rm .github/workflows/apply-fronting-runtime.yml
          git diff --check
      - name: Commit applied runtime wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire fronting into direct runtime [fronting-runtime-applied]'
          git push origin HEAD:upstream-v1.10-fronting-runtime
